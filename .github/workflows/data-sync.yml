# ABOUTME: Daily check for new atlas tree / map-mod regex data. Opens a `patch` PR when data changed and
# ABOUTME: merges it automatically when validation and build checks pass; otherwise leaves it for review.

name: Data Sync

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Open/update the PR but never merge it'
        type: boolean
        default: false

concurrency: data-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Sync game data
        id: sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-game-data.mjs --summary "$RUNNER_TEMP/summary.md"

      - name: Install dependencies
        if: steps.sync.outputs.changed == 'true'
        run: npm ci

      - name: Type check, lint, test, build
        id: checks
        if: steps.sync.outputs.changed == 'true'
        continue-on-error: true
        run: |
          npx tsc --noEmit
          npm run lint
          npm test
          npm run build:vite

      - name: Open or update PR
        id: pr
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          BRANCH=chore/data-sync
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add src/data public/atlas CHANGELOG.md
          git commit -m "Update game data"
          git push --force origin "$BRANCH"

          PR=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -z "$PR" ]; then
            gh pr create --base main --head "$BRANCH" --title "Update game data" \
              --body-file "$RUNNER_TEMP/summary.md" --label patch --label data-sync
            PR=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')
          else
            gh pr edit "$PR" --body-file "$RUNNER_TEMP/summary.md"
          fi
          echo "number=$PR" >> "$GITHUB_OUTPUT"

      - name: Merge (triggers auto-release)
        if: >-
          steps.sync.outputs.changed == 'true' && steps.sync.outputs.valid == 'true'
          && steps.checks.outcome == 'success' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: gh pr merge "${{ steps.pr.outputs.number }}" --merge --admin --delete-branch

      - name: Report why it was not merged
        if: >-
          steps.sync.outputs.changed == 'true'
          && (steps.sync.outputs.valid != 'true' || steps.checks.outcome != 'success')
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          {
            echo "Not merged automatically."
            echo
            echo "- Data validation: ${{ steps.sync.outputs.valid == 'true' && 'passed' || 'failed (see Problems in the description)' }}"
            echo "- Type check / lint / test / build: ${{ steps.checks.outcome }}"
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "${{ steps.pr.outputs.number }}" --body-file "$RUNNER_TEMP/comment.md"
