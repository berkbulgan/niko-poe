# ABOUTME: GitHub Actions workflow that builds the Windows NSIS installer and
# ABOUTME: creates a GitHub Release with the updater manifest on version tag push.

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NIKO_COMMUNITY_API_URL: ${{ secrets.NIKO_COMMUNITY_API_URL }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: 'N.I.K.O. ${{ github.ref_name }}'
          releaseBody: |
            ## Changes

            See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            ## Installation

            Download the `_x64-setup.exe` file below.

            **Note on SmartScreen:** Until a code signing certificate is acquired, Windows may show a SmartScreen warning.
            Click "More info" → "Run anyway" to proceed. The installer is safe.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
